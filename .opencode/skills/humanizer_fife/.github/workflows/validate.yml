name: validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (tags are mutable)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Package checks (version sync across manifests, pattern numbering, word budget)
        run: python scripts/validate-package.py
      - name: Rhythm metrics self-check
        run: python evals/test_rhythm_metrics.py
      - name: Eval tooling self-tests
        run: |
          python evals/make_pairs.py --selftest
          python evals/check_profile.py --selftest
          python evals/jfleg_restraint.py --selftest
      - name: Frozen run-3 manifest verification
        run: python evals/freeze_run.py --verify evals/results/manifests/run3.json
      - name: Skill discovery (agentskills CLI)
        run: npx --yes skills add . --list
      # `claude plugin validate .` needs the Claude CLI and runs as a local
      # pre-release check, not in CI — see CONTRIBUTING notes in AGENTS.md.
