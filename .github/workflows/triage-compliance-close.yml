name: triage-compliance-close

on:
  schedule:
    # Run every 30 minutes to check for expired compliance windows
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log expired items without closing them"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-non-compliant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Close non-compliant issues and PRs after 72 hours
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()

          if [ "${{ github.event_name }}" = "schedule" ]; then
            args+=("--execute")
          elif [ "${{ inputs['dry-run'] }}" = "false" ]; then
            args+=("--execute")
          fi

          bun script/github/compliance-close.ts "${args[@]}"
